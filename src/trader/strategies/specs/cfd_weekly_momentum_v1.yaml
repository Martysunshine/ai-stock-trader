# Weekly time-series momentum on Capital.com's commodity, currency and index CFDs, long and short
# (ADR-0058, trial T-0025). The rule of T-0019 (cfd_crypto_weekly_momentum_v1) carried to markets
# that close at the weekend: their daily sessions are weekdays (BROKER_CFD, the Sunday-evening
# hours joined to Monday), so a week is five sessions and the week's last session is Friday's.
# On Friday's daily bar: long when the close is above the close five sessions earlier, short when
# below; stop 3 x ATR(10) from the close, target twice that distance on the other side; out after
# one week from the entry (the Sunday-evening open). Fixed in the decision record before any
# result existed; only the two calendar numbers differ from T-0019, nothing was tuned.
strategy_id: cfd_weekly_momentum
version: 1
family: CFD_WEEKLY_MOMENTUM
feature_version: daily-v1
max_hold_hours: 168
lookback_days: 5
decision_weekday: 4
atr_period: 10
stop_atr_multiplier: "3"
reward_risk: "2"
research_status: UNVALIDATED - declared rule; evaluated only through registered trials
