# Day trade with the break of the last 24 hourly bars, CFD sleeve (ADR-0055, trial T-0021).
# Fixed in the decision record before any result existed; nothing here was tuned. On an hourly
# bar ending from 07:00 to 17:00 UTC whose mid close is above the highest high of the previous
# 24 hourly bars: long; below their lowest low: short. Stop 2 x the mean true range of the last
# 24 bars from the close, target twice that distance, closed at 20:00 UTC at the latest (before
# the 22:00 UTC financing charge).
strategy_id: cfd_hourly_breakout
version: 1
family: CFD_HOURLY_CHANNEL
feature_version: hourly-v1
mode: breakout
max_hold_hours: 13
channel_hours: 24
atr_hours: 24
stop_atr_multiplier: "2"
reward_risk: "2"
entry_first_hour_utc: 7
entry_last_hour_utc: 17
flat_hour_utc: 20
research_status: UNVALIDATED - declared rule; evaluated only through registered trials
