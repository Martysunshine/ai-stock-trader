# Day trades on the break of the last 24 hourly bars, crypto sleeve: with the break (T-0023) and
# against it (T-0024). ADR-0055. Fixed in the decision record before any result existed;
# registered before it is run.
kind: cfd_study
study_id: cfd_crypto_hourly_channel_v1
title: Day trades on the 24-hour channel - Bitcoin and Ether CFDs, with the break and against it
track: COMMODITIES
description: >-
  Whether an hourly close beyond the range of the previous 24 hourly bars is followed, within the
  same day, by more of the move or by a return, on the Bitcoin and Ether CFDs, traded as the
  crypto practice sleeve would: USD 100 per window, at most 1% of equity at the stop, one crypto
  trade at a time, total notional at most equity, fills on the broker's own bid and ask, closed
  at 21:00 UTC so that no overnight financing is paid.
quote_dataset: capital_demo_crypto_cfd_1h_v1
bars: {source_minutes: 60, calendar: UTC_24_7, closed_run_max_weekdays: 0, decision_minutes: 60}
instruments:
  - {instrument_id: "CAPITAL:BTCUSD"}
  - {instrument_id: "CAPITAL:ETHUSD"}
instrument_specs: configs/instruments/capital_demo_cfds_v1.yaml
fee_schedule: configs/fees/capital_com_cfd_demo_v1.yaml
policy: configs/policy/crypto_cfd_sleeve_v1.yaml
costs:
  slippage_bps: "1"
  # today's median quoted spread (hourly dataset, 2026): a bar quoting less is not believed
  spread_floor_bps: {"CAPITAL:BTCUSD": "6.8", "CAPITAL:ETHUSD": "8.1"}
stress:
  spread_multiplier: "2"
  slippage_multiplier: "2"
  financing_charge_multiplier: "1.5"
  financing_credits: false
  missed_entry_percent: 5
warmup_days: 30
splits:
  development_start: "2025-01-01T00:00:00Z"
  holdout_start: "2026-08-01T00:00:00Z"
  holdout_end: "2026-11-01T00:00:00Z"
  walk_forward: {train_months: 3, validation_months: 3, test_months: 3, step_months: 3}
  embargo_minutes: 0
bootstrap:
  replicates: 2000
  mean_block_sessions: "5"
  seed: 20261114
annualisation_sessions: 365
universe_selection: >-
  The two crypto CFDs the crypto practice sleeve may trade (ADR-0049), Bitcoin and Ether, chosen
  before any result; they move together, so one trade is open at a time.
horizon: >-
  Hourly bars as the broker quoted them, sessions counted as UTC days. A trade is opened on a
  decision at an hour ending from 00:00 to 17:00 UTC and is closed by its stop, its target or at
  21:00 UTC the same day. Three-month windows from USD 100, each an independent deployment. The
  period starts on 2025-01-01: the dataset's quality report shows the broker's median quoted
  spread on Bitcoin at 16.5 bps in 2024 and 25 to 87 bps before, against 4.8 in 2025 and 6.8 in
  2026 (Ether 19.4, 29 to 118, 5.9, 8.1). A day trade pays the spread every day, so earlier
  years would test a cost that no longer exists. Nineteen months is one market regime.
entry_exit_timing: >-
  Decision on a completed hourly bar; a market order at the open of the next hourly bar, buying
  the ask or selling the bid with 1 bp of slippage, sized at that price; refused when that open
  is beyond the stop, at or after 21:00 UTC, or when the quoted spread is above 60 bps. Stops
  and targets are checked inside each hourly bar on the side that would fill, the stop first
  when both are touched; the time exit closes at the first open at or after 21:00 UTC. A trade
  that is still open at the 22:00 UTC charge (it should not be) pays financing.
known_before_registration: >-
  No hourly rule has been run on these instruments in this project. The weekly momentum rule
  T-0019 was run on the same CFDs from daily bars over 2018-2026 (base +19.51 USD, stressed
  +1.23), and the crypto baseline T-0001 to T-0005 ran 15-minute rules on Coinbase spot at
  Kraken's fees (no gross edge). The quality report of the hourly dataset was read before the
  period was fixed. The two trials are the two sides of one question and are selected between
  only by the walk forward's validation windows.
trials:
  - trial_id: T-0023
    spec_file: src/trader/strategies/specs/cfd_crypto_hourly_breakout_v1.yaml
    hypothesis: >-
      On Capital.com's Bitcoin and Ether CFDs, entering in the direction of an hourly close
      beyond the previous 24 hourly bars' range, with a stop twice the mean hourly true range
      away and a target twice that distance, closed by 21:00 UTC, earns a positive net result
      after the quoted spread and slippage, sized as the crypto practice sleeve, from 2025-01 to
      2026-07 in independent three-month deployments.
  - trial_id: T-0024
    spec_file: src/trader/strategies/specs/cfd_crypto_hourly_fade_v1.yaml
    hypothesis: >-
      On the same CFDs, entering against an hourly close beyond the previous 24 hourly bars'
      range, with a stop twice the mean hourly true range away and a target at the same distance,
      closed by 21:00 UTC, earns a positive net result after the quoted spread and slippage,
      sized as the crypto practice sleeve, from 2025-01 to 2026-07 in independent three-month
      deployments.
