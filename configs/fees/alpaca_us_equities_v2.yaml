# Alpaca US equities, verified from official pages on 2026-11-08 (supersedes the cost basis in
# alpaca_us_equities.yaml, which is kept unchanged as the historical "unknown" record).
#
# What is charged (Alpaca Brokerage Fee Schedule, revised 2026-10-12):
#   * no commission for ordinary US equity trades (commissions apply only to index options, the
#     Elite Smart Router and order flow deemed non-retail);
#   * SEC Section 31 transaction fee on SELLS: rate x trade value;
#   * FINRA Trading Activity Fee (TAF) on SELLS: per share, with a per-trade maximum;
#   * FINRA Consolidated Audit Trail (CAT) fee on BUYS AND SELLS: per executed equivalent share;
#   * fees are computed on the exact executed quantity including fractional shares; each fee type
#     is aggregated per account per day and the daily total is rounded UP to USD 0.01.
#
# CONSERVATIVE CHOICES (one schedule must cover the whole backtest, 2022-01 .. 2026-11):
#   * SEC rate = the HIGHEST rate in force over 2022-01-01 .. 2026-11-08:
#       5.10 USD per million  until 2022-05-13
#      22.90                  2022-05-14 .. 2023-02-26
#       8.00                  2023-02-27 .. 2024-05-21
#      27.80  <- maximum      2024-05-22 .. 2025-05-13
#       0.00                  2025-05-14 .. 2026-04-03
#      20.60                  2026-04-04 .. (60 days after the FY2027 appropriation; no FY2027
#                             Section 31 advisory was listed on 2026-11-08)
#   * TAF = the HIGHEST covered-equity rate and cap in force over the same span:
#      0.000130/share, max 6.49  2022;  0.000145, max 7.27  2023;  0.000166, max 8.30  2024-2025;
#      0.000195, max 9.79  2026-01-01 .. 2026-09-30  <- maximum;  0.00  2026-10-01 .. 2026-12-31
#      (temporary pause, SR-FINRA-2026-021).
#   * CAT = the HIGHEST combined industry-member CAT rate: CAT Fee 2024-1 (0.000035) plus
#     Historical CAT Assessment 1 (0.000013) = 0.000048 per executed equivalent share (in force
#     together for the August 2024 .. January 2025 invoices). Alpaca's schedule shows 0.000003
#     today; no dated official Alpaca page shows what it passed through in 2024-2025, so the
#     full industry-member rate is ASSUMED to have been passed through.
#   * Rounding is modelled PER ORDER: each fee type is rounded up to USD 0.01 on every order.
#     Alpaca's current schedule aggregates per day first; because ceil(a + b) <= ceil(a) +
#     ceil(b), per-order rounding is an upper bound of the daily method, and it equals the
#     per-trade rounding described by Alpaca's support article ("rounded up to the nearest
#     penny"). A tiny fractional sell therefore costs USD 0.03 (SEC 0.01 + TAF 0.01 + CAT 0.01)
#     and a tiny buy USD 0.01 (CAT).
#   * minimum_per_order is 0.00: no minimum is documented beyond the rounding, which already
#     makes every non-zero component at least USD 0.01.
#
# ASSUMPTIONS that are NOT verified from an official page (each is conservative or neutral):
#   * the owner's account is a retail Alpaca Securities account trading through the API
#     (commission-free); an account opened through a business partner may differ;
#   * no SEC Section 31 change took effect between the last listed advisory and 2026-11-08;
#   * the historical Alpaca pass-through followed the official SEC/FINRA/CAT rates above.
# The schedule must be re-checked per account before paper (M4) or any live decision; the
# registration binds this file's path and schedule_id, so any change needs a new schedule_id.
schedule_id: alpaca-us-equities-conservative-2026-11-08
description: >-
  Alpaca US equities via API - zero commission; SEC Section 31, FINRA TAF and CAT pass-through at
  the highest rates in force 2022-01..2026-11, each rounded up to USD 0.01 per order
evidence: DOCUMENTED
known: true
source: https://files.alpaca.markets/disclosures/library/BrokFeeSched.pdf
as_of: "2026-11-08"
currency: USD
default_liquidity: TAKER
components:
  - type: regulatory_sell
    sec_rate: "0.0000278"   # 27.80 USD per million (SEC FY2024 order, in force 2024-05-22 .. 2025-05-13)
    taf_per_share: "0.000195"  # FINRA TAF 2026 covered-equity rate (SR-FINRA-2024-019)
    taf_max: "9.79"         # FINRA TAF 2026 per-trade maximum
    minimum_per_order: "0.00"
    granularity: "0.01"     # rounded up to the cent (per order: conservative, see above)
  - type: per_share
    sides: [BUY, SELL]
    rate_per_share: "0.000048"  # CAT Fee 2024-1 0.000035 + Historical CAT Assessment 1 0.000013
    granularity: "0.01"
notes: >-
  Highest SEC, TAF and CAT rates of 2022-01..2026-11 with per-order rounding up to the cent; an
  upper bound of the documented daily aggregation. Taxes, FX and funding costs are not fees and
  are not modelled here.
sources:
