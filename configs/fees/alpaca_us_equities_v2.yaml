      to the nearest penny; TAF based on shares, sells only, applied per trade, rounded up to the
      nearest penny and capped; CAT fee = fee rate x executed equivalent shares, charged per trade
      on purchases and sales in addition to the SEC/TAF fees.
    retrieved: "2026-11-08"
