    states: >-
      Alpaca Brokerage Fee Schedule, revised 2026-10-12. Alpaca Securities does not charge
      commissions except for index options, the Elite Smart Router and non-retail order flow.
      Pass-through equities fees: SEC transaction fee, sells only, 0.0000206 x trade value; FINRA
      TAF, sells only, 0 USD per share; FINRA CAT fee, buys and sells, 0.000003 USD per executed
      equivalent share (NMS equities: 1 share = 1 executed equivalent share). Fees are calculated
      on the exact executed quantity including fractional shares; each fee type is aggregated
      separately per account per day and each total is rounded up to the nearest cent.
    retrieved: "2026-11-08"
