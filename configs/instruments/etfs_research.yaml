# Research instrument specs for the 16-ETF daily universe (dataset alpaca_us_etfs_daily_sip_v1).
# Generated 2026-11-09 from Alpaca's paper Trading API, GET /v2/assets/{symbol} (read-only):
# asset id, listing exchange, class us_equity, status active, tradable and fractionable as
# returned. Minimum notional (USD 1), the 1e-9 share step and the USD 0.01 tick follow Alpaca's
# fractional-trading documentation, as for configs/instruments/stocks_paper.yaml (evidence
# DOCUMENTED). Instrument ids use the listing exchange's MIC (ARCA -> ARCX, NASDAQ -> XNAS);
# price and execution ids are the same for this dataset.
#
# Product type ETF, not ORDINARY_EQUITY: markets_and_brokers.md section 7 separates US ETFs
# (product-document restrictions for European retail investors; "do not default to SPY/QQQ/GLD
# as live holdings") from the ordinary shares v1 trades. The STOCKS profile admits
# ORDINARY_EQUITY only, so these specs are for research; trading any of them needs an
# owner-approved profile and the owner's confirmation that the account may buy them.
#
# Concentration tags (ADR-0015: a shared underlying exposure, capped like one symbol at 20%):
#   US_EQUITY_INDEX  SPY, QQQ, IWM, DIA - broad US equity index funds holding largely the same
#                    large-cap stocks (every Dow member is in the S&P 500) that move nearly
#                    together; treating them as diversifying one another would understate risk.
#   US_TREASURY      TLT, IEF - US Treasury duration at two maturities.
#   GOLD             GLD - physical gold, shared with any gold ETC, CFD or miner.
# The nine Select Sector SPDRs carry no tag: ADR-0015 keeps sector labels out of tags, each
# fund is its own sector capped as a single symbol, and their overlap with the index funds is
# left to the 40% gross cap and disclosed in reports.
# Leveraged and inverse funds are excluded (instructions.md section 5).
