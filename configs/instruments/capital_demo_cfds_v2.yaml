  identity: {instrument_id: "CAPITAL:GOLD", broker: capital_com_demo, broker_asset_id: GOLD, symbol: GOLD, currency: USD, product_type: CFD, track: COMMODITIES}
  underlying: Gold
  quantity_unit: contract
  quantity_step: "0.01"
  min_quantity: "0.01"
  min_notional: "0"
  price_tick: "0.01"
  contract_multiplier: "1"
  price_scale: "1"
  exposure_tags: [GOLD]
  allowed_directions: [LONG, SHORT]
  fractionable: true
  evidence: DOCUMENTED
  as_of: "2026-11-10T21:22:00Z"
  source: Capital.com demo API /markets GOLD, read 2026-11-10
