# Capital.com DEMO CFDs, version 2 (ADR-0060): version 1 unchanged (it is an input of registered
# trials and pinned) plus four commodities the practice trader trades in practice mode: copper,
# Brent oil, heating oil and natural gas, read from the demo API's /markets on 2026-11-11
# (dealingRules, decimalPlacesFactor, marginFactor, overnightFee). Platinum (39 bps), palladium
# (70), nickel (40), aluminium (34), lead and zinc quote spreads far above the sleeve's 20 bps
# entry limit and are left out. Rare earths and magnet metals have no commodity CFD on
# Capital.com (only shares such as MP Materials). What follows the first blank line is version 1.
#

# Capital.com DEMO CFDs for research studies (ADR-0052), read from the demo API on 2026-11-10
# (`/markets`: dealingRules, marginFactor, overnightFee). DOCUMENTED evidence: the broker's own
# metadata, not yet checked against a demo statement (no certification example), so no runtime
# component may trade from this file; the CFD study engine sizes and costs simulated trades with it.
#
# * Every epic is a `kind: commodity` CFD on the COMMODITIES track, whatever its underlying: the
#   domain model has one CFD contract type (COMMODITIES_AND_CFD_TRACK.md section 5), and the track
#   profile allows LONG and SHORT in replay. Index, FX and crypto CFDs are not in a spec track;
#   ADR-0052 records that this file is research-only.
# * One contract is one unit of the quoted price (contract_multiplier 1): a US500 size of 0.01 at
#   7,500 is USD 75 of notional, as the demo's position previews show.
# * financing: `overnightFee` is quoted in percent per night as the cash flow to the client, so the
#   fraction here is minus that rate over 100 (positive = a charge). Charged at 22:00 UTC
#   (swapChargeTimestamp). Markets closed at the weekend charge the Friday night three times
#   (weekend_multiplier_days 3; the broker states no weekday, and FX conventionally triples on
#   Wednesday: the weekly total is the same). Crypto CFDs trade every day and are charged each
#   night (1). The rates are today's and are applied to every year of a study: a stated limit.
# * exposure_tags are the correlation groups: one open trade per tag in the CFD study.
