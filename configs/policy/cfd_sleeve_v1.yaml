# RESEARCH-ONLY policy for CFD studies (ADR-0052): the CFD practice sleeve's economics,
# configs/practice/capital_demo.yaml. Never a runtime policy: the runtime refuses any policy whose capital,
# risk or caps differ from base.yaml outside paper mode, and the CFD study engine is the only
# reader.
#
# What the CFD study engine reads: initial_trading_capital (each window starts here),
# risk_per_trade_fraction and max_total_planned_risk_fraction (planned loss at the stop),
# max_gross_exposure_fraction and max_symbol_exposure_fraction (1.00: the notional of all open
# trades together never exceeds equity, so no leverage beyond one times equity is used), the cash
# reserve (zero: the gross cap binds first and margin is at most half of equity),
# max_open_positions, max_new_entries_per_session, max_entry_spread_bps (the quoted spread at the
# entry), gap_allowance_floor_bps, initial_capital_pause_floor and
# max_high_water_drawdown_fraction (no new entries for the rest of a window).
#
# The `instruments` block keeps base.yaml's stock-execution flags, which the policy validator
# requires: they describe the stock runtime. A CFD study takes its directions from each
# instrument spec and the COMMODITIES track profile (LONG and SHORT in replay), not from here.
policy_version: 1
mode: replay
base_currency: USD
initial_trading_capital: "100.00"
live_enabled: false

instruments:
  ordinary_equities_only: true
  long_only: true
  fractional_only_if_certified: true
  leverage_enabled: false
  shorting_enabled: false
  extended_hours_enabled: false
  minimum_notional_from_broker: true

exposure:
  risk_per_trade_fraction: "0.02"
  max_total_planned_risk_fraction: "0.04"
  max_gross_exposure_fraction: "1.00"
  max_symbol_exposure_fraction: "1.00"
  minimum_cash_reserve_fraction: "0"
  minimum_cash_reserve_absolute: "0"
  max_open_positions: 2
  live_pilot_max_open_positions: 1
  max_pending_entry_orders: 1
  max_new_entries_per_session: 4

loss_limits:
  daily_loss_fraction: "0.04"
  weekly_loss_fraction: "0.08"
  max_high_water_drawdown_fraction: "0.10"
  initial_capital_pause_floor: "90.00"
  automatic_resume_after_loss_breach: false

quality:
  max_quote_age_seconds: 2
  max_account_snapshot_age_seconds: 5
  max_clock_skew_milliseconds: 250
  max_entry_spread_bps: 20
  gap_allowance_floor_bps: 10
  require_feed_parity: true
  require_positive_conservative_net_edge: true

execution:
  native_protection_required_for_live: true
  allow_blind_submission_retries: false
  unknown_order_blocks_new_entries: true
  preserve_risk_reducing_exits_when_paused: true
  funds_check_uses_actual_account_rule_profile: true

expenses:
  paid_data_enabled: false
  live_loop_llm_api_budget_usd_per_day: "0.00"
  automatic_funding_enabled: false
  automatic_withdrawals_enabled: false
