# PAPER EXPLORATION ONLY (ADR-0057) - the aggressive stock book the owner asked for on
# 2026-11-11 ("at least 15-20 trades a day", "we have paper money, so we can be risking and
# trying"). The runtime config refuses this file outside paper mode, like every paper_ policy.
# Its results are kept apart from the three USD 100 practice sleeves, which stay the record that
# decides where the owner's real money goes.
#
# Changes against paper_practice_v1.yaml, all of them numbers; every safety capability stays:
# - capital USD 300, the owner's real starting amount;
# - 2% of equity at the stop per trade (USD 6), 10% planned risk in total;
# - the whole capital may be invested (gross 100%, no cash reserve), at most 25% in one stock
#   (USD 75), so a position's ~USD 0.04 of fees is about 0.05% instead of 0.2%;
# - five open positions and 20 entries a session;
# - entries refused above 20 bps of quoted spread (10 in practice): the free IEX quote is often
#   wider than the market, and refused three of eight signals on 2026-11-11;
# - loss limits loosened but kept: 5% a day, 15% a week, 30% from the high, a floor at USD 210.
# No borrowing and no shorting: the v1 policy refuses both, and the code has neither.
policy_version: 1
mode: replay
base_currency: USD
initial_trading_capital: "300.00"
live_enabled: false

instruments:
  ordinary_equities_only: true
  long_only: true
  fractional_only_if_certified: true
  leverage_enabled: false
  shorting_enabled: false
  extended_hours_enabled: false
  minimum_notional_from_broker: true

exposure:
  risk_per_trade_fraction: "0.02"
  max_total_planned_risk_fraction: "0.10"
  max_gross_exposure_fraction: "1.00"
  max_symbol_exposure_fraction: "0.25"
  minimum_cash_reserve_fraction: "0"
  minimum_cash_reserve_absolute: "0"
  max_open_positions: 5
  live_pilot_max_open_positions: 1
  max_pending_entry_orders: 1
  max_new_entries_per_session: 20

loss_limits:
  daily_loss_fraction: "0.05"
  weekly_loss_fraction: "0.15"
  max_high_water_drawdown_fraction: "0.30"
  initial_capital_pause_floor: "210.00"
  automatic_resume_after_loss_breach: false

quality:
  max_quote_age_seconds: 2
  max_account_snapshot_age_seconds: 5
  max_clock_skew_milliseconds: 250
  max_entry_spread_bps: 20
  gap_allowance_floor_bps: 10
  require_feed_parity: true
  require_positive_conservative_net_edge: true

execution:
  native_protection_required_for_live: true
  allow_blind_submission_retries: false
  unknown_order_blocks_new_entries: true
  preserve_risk_reducing_exits_when_paused: true
  funds_check_uses_actual_account_rule_profile: true

expenses:
  paid_data_enabled: false
  live_loop_llm_api_budget_usd_per_day: "0.00"
  automatic_funding_enabled: false
  automatic_withdrawals_enabled: false
