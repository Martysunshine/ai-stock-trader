# PAPER PRACTICE ONLY (ADR-0043) - the STOCKS sleeve, run like production; the runtime config
# refuses this file outside paper mode. Owner decision 2026-11-09: three sleeves of USD 100
# (stocks, crypto, gold/CFD commodities), no further deposits, profits compound. Copy of
# configs/policy/base.yaml (unchanged and pinned) except: initial_trading_capital 100 with the
# USD amounts scaled like config.policy.scale_policy (cash reserve 60, capital floor 90), and
# max_new_entries_per_session 12 (owner decision 2026-11-10: the daily count should not be what
# refuses a trade; a rehearsal of 2026-11-09's 23 real signals took 4 trades at a limit of 4 and
# 9 with no limit, the rest being repeats while a position was open). Two open positions, the 20% symbol cap (USD 20), the 40% gross
# cap and every risk and loss fraction are base's: at USD 20 a position's cent-rounded fees
# (~USD 0.04 a round trip) are 0.2%, at USD 10 they would be 0.4%.
policy_version: 1
mode: replay
base_currency: USD
initial_trading_capital: "100.00"
live_enabled: false

instruments:
  ordinary_equities_only: true
  long_only: true
  fractional_only_if_certified: true
  leverage_enabled: false
  shorting_enabled: false
  extended_hours_enabled: false
  minimum_notional_from_broker: true

exposure:
  risk_per_trade_fraction: "0.0025"
  max_total_planned_risk_fraction: "0.0050"
  max_gross_exposure_fraction: "0.40"
  max_symbol_exposure_fraction: "0.20"
  minimum_cash_reserve_fraction: "0.60"
  minimum_cash_reserve_absolute: "60.00"
  max_open_positions: 2
  live_pilot_max_open_positions: 1
  max_pending_entry_orders: 1
  max_new_entries_per_session: 12

loss_limits:
  daily_loss_fraction: "0.01"
  weekly_loss_fraction: "0.025"
  max_high_water_drawdown_fraction: "0.10"
  initial_capital_pause_floor: "90.00"
  automatic_resume_after_loss_breach: false

quality:
  max_quote_age_seconds: 2
  max_account_snapshot_age_seconds: 5
  max_clock_skew_milliseconds: 250
  max_entry_spread_bps: 10
  gap_allowance_floor_bps: 10
  require_feed_parity: true
  require_positive_conservative_net_edge: true

execution:
  native_protection_required_for_live: true
  allow_blind_submission_retries: false
  unknown_order_blocks_new_entries: true
  preserve_risk_reducing_exits_when_paused: true
  funds_check_uses_actual_account_rule_profile: true

expenses:
  paid_data_enabled: false
  live_loop_llm_api_budget_usd_per_day: "0.00"
  automatic_funding_enabled: false
  automatic_withdrawals_enabled: false
