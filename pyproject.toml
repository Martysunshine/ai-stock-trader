[project]
name = "ai-stock-trader"
version = "0.1.0"
description = "Evidence-gated automated trading system: replay/paper first, one shared USD 50 risk budget. See docs/PROJECT_GUIDE.md."
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "typer>=0.15,<1",
    "exchange-calendars>=4.6,<5",
    "tzdata>=2025.1",
    "duckdb>=1.1,<2",
    "numpy>=2.0,<3",
    "keyring>=25.7,<26",
    "truststore>=0.10,<0.11",
    "alpaca-py==0.44.0",
]

[project.scripts]
trader = "trader.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "hypothesis>=6.120,<7",
    "ruff>=0.9",
    "mypy>=1.14,<2",
    "types-PyYAML>=6.0",
]
ml = [
    "lightgbm>=4.7,<5",
    "scikit-learn>=1.9,<2",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.uv]
# "ml" is research-only (ADR-0027): installed by default for development, never a runtime dependency.
default-groups = ["dev", "ml"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md", "deploy/migrations/versions/*.py"]
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "TID", "RUF", "SIM", "PIE", "PT"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM108", "B008", "E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Use an injected Clock (trader.ops.clock); wall-clock reads break replay determinism."
"datetime.datetime.utcnow".msg = "Naive and wall-clock; use trader.ops.clock."
"datetime.date.today".msg = "Use an injected Clock (trader.ops.clock)."
"time.time".msg = "Use an injected Clock (trader.ops.clock)."
"uuid.uuid4".msg = "Use deterministic IDs from trader.domain.ids."
"random".msg = "Randomness is only allowed in data/synthetic.py with an explicit seed."

[tool.ruff.lint.per-file-ignores]
"src/trader/ops/clock.py" = ["TID251"]
"src/trader/data/synthetic.py" = ["TID251"]
"src/trader/data/synthetic_history.py" = ["TID251"]
"src/trader/cli/main.py" = ["TID251"]
"tests/**" = ["TID251", "S101", "PT011", "PT018", "SIM102"]

[tool.ruff.format]
exclude = ["*.md"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["trader"]
warn_unreachable = true
cache_dir = ".cache/mypy"

[[tool.mypy.overrides]]
module = [
    "exchange_calendars", "exchange_calendars.*", "pandas", "pandas.*",
    "sklearn", "sklearn.*", "lightgbm", "lightgbm.*", "scipy", "scipy.*",
    "alpaca", "alpaca.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".cache/pytest"
addopts = "-ra --strict-markers"
markers = [
    "pg: requires the PostgreSQL test database (docker compose up -d). Fails loudly if unavailable.",
    "slow: slower end-to-end scenario tests.",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "ignore:Series.values returning an ndarray:DeprecationWarning",
    "ignore:Series.values returning an ndarray:FutureWarning",
]
